spring:
  application:
    name: webhook-delivery
  profiles:
    default: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webhooks}
    username: ${DB_USER:webhooks}
    password: ${DB_PASSWORD}
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
delivery:
  warehouse-url: ${WAREHOUSE_URL:http://localhost:8081/hooks/orders}
  secret: ${WEBHOOK_SECRET}
  http-timeout: 2s
  lease: 8s
  max-attempts: 5
  retry-base: 1s
  retry-cap: 30s
  poll-ms: 150
---
spring:
  config:
    activate:
      on-profile: worker
  main:
    web-application-type: none
---
spring:
  config:
    activate:
      on-profile: warehouse
  web:
    resources:
      add-mappings: false
